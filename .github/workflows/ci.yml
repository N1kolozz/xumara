name: CI

# Lint, type-check and build on every push and pull request so regressions
# (dead code, type errors, broken builds) are caught before they reach main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      # The Supabase env vars are only read at runtime (in the browser), not at
      # build time, so the production build compiles fine without secrets.
      - name: Build
        run: npm run build
