name: Keep Supabase awake

# Supabase free-tier projects pause after ~7 days of inactivity. A small
# scheduled query counts as activity and keeps the project from pausing.
on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $code"
          # Fail the run on server/auth errors so it's visible in the Actions tab.
          if [ "$code" -ge 400 ]; then exit 1; fi
